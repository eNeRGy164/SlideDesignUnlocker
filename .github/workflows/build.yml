name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: arm64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SlideDesignUnlocker/SlideDesignUnlocker.csproj

      - name: Build
        run: dotnet build SlideDesignUnlocker/SlideDesignUnlocker.csproj -c Release -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.rid }} --no-restore

  build-apple:
    runs-on: macos-26
    strategy:
      matrix:
        target: [net10.0-maccatalyst, net10.0-ios]
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload install maui

      - name: Build
        run: dotnet build SlideDesignUnlocker.Mac/SlideDesignUnlocker.Mac.csproj -c Release -f ${{ matrix.target }}
